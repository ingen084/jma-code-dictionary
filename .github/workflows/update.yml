name: update

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Run
        id: run
        shell: bash -xe {0}
        run: |
          cd JmaCodeDictionary/JmaCodeDictionaryGenerator
          dotnet build -c Release
          # 終了コード 0: 更新なし, 1: 更新あり, それ以外: エラー
          dotnet run -c Release --no-build || [ $? -eq 1 ]
          # 新しく追加された CSV も検知できるよう、ステージしてから差分を確認する
          git add ../../csv ../../derived ../../.cache
          if ! git diff --cached --quiet; then
            git remote set-url origin https://github-actions:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}
            git config --global user.email "ingen188@gmail.com"
            git config --global user.name "ingen084"
            if ! git diff --cached --quiet -- ../../csv ../../derived; then
              CSV_UPDATED=true
            fi
            git commit -m "Update `date '+%Y.%m.%d'`"
            git push
            if [ "$CSV_UPDATED" = true ]; then
              gh release create `date '+%Y.%m.%d'`
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
